services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: geostats
      POSTGRES_PASSWORD: geostats
      POSTGRES_DB: geostats
    ports:
      - "5432:5432"
    volumes:
      - geostats_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geostats"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  geostats_db:
