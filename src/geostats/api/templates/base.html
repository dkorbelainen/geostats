<head>
<meta charset="utf-8">

<title>{% block title %}GeoStats{% endblock %}</title>

<meta property="og:title" content="GeoStats — Track your GeoGuessr rank">
<meta property="og:description" content="Daily ranking tracker for GeoGuessr players.">
<meta property="og:image" content="https://geostats.tech/static/social-card.png">

<body>
<div class="sky-layer" id="sky-a"></div>
<div class="sky-layer" id="sky-b"></div>

</button>

{% block body %}{% endblock %}

               .07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15
               -.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27
               .68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12

<script>
(function () {
  const SKIES = [
    '/static/sky2.jpg',
    '/static/sky0.jpg',
    '/static/sky1.jpg',
    '/static/sky3.jpg',
    '/static/sky4.jpg',
  ];
  const SK_KEY = 'gs_sky';

  const layerA = document.getElementById('sky-a');
  const layerB = document.getElementById('sky-b');
  const btn    = document.getElementById('sky-btn');
  const banner = document.querySelector('.top-banner');

  let current = +(localStorage.getItem(SK_KEY) ?? 0);
  let front   = layerA;
  let back    = layerB;

  function applyBg(idx, animate) {
    const url = `url('${SKIES[idx]}')`;
    if (banner) banner.style.backgroundImage = url;

    if (!animate) {
      front.style.backgroundImage = url;
      front.classList.add('sky-active');
      return;
    }
    back.style.backgroundImage = url;
    back.classList.add('sky-active');
    front.classList.remove('sky-active');
    [front, back] = [back, front];
  }

  function next() {
    current = (current + 1) % SKIES.length;
    localStorage.setItem(SK_KEY, current);
    applyBg(current, true);
    btn.classList.add('spinning');
    setTimeout(() => btn.classList.remove('spinning'), 400);
  }

  applyBg(current, false);
  btn.addEventListener('click', next);

  window.addEventListener('load', () => {
    SKIES.forEach(src => { const img = new Image(); img.src = src; });
  });
})();
</script>
</body>
</html>
