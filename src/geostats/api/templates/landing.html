{% extends "base.html" %}
{% block title %}GeoStats — GeoGuessr Rating Tracker{% endblock %}
{% block body %}
<div class="landing">
  <div class="landing-inner">
    <div class="site-logo">GeoStats</div>
    <p class="tagline">Track GeoGuessr ratings over time</p>
    <form method="post" action="/lookup">
      {% if error %}<p class="form-error">{{ error }}</p>{% endif %}
      <input class="lookup-input" type="text" name="profile"
             placeholder="Player URL or user ID" autofocus autocomplete="off">
      <button class="lookup-btn" type="submit">Look up</button>
    </form>
  </div>
</div>
{% endblock %}
