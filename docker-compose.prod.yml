x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  build: .
  image: geostats:latest

x-app-env: &app-env
  DATABASE_URL: >-
    postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db/${POSTGRES_DB}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "psql -U ${POSTGRES_USER} -d ${POSTGRES_DB} -c 'SELECT 1' > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    logging: *default-logging
    restart: unless-stopped
    networks:
      - backend_net
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *app
    logging: *default-logging
    command: alembic upgrade head
    environment:
      <<: *app-env
    networks:
      - backend_net
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  api:
    <<: *app
    logging: *default-logging
    restart: unless-stopped
    environment:
      <<: *app-env
      GEOGUESSR_NCFA_COOKIE: ${GEOGUESSR_NCFA_COOKIE:-}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    networks:
      - frontend_net
      - backend_net
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')\" 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  poller:
    <<: *app
    logging: *default-logging
    restart: unless-stopped
    command: ["geostats", "daemon"]
    stop_grace_period: 60s
    environment:
      <<: *app-env
      GEOGUESSR_NCFA_COOKIE: ${GEOGUESSR_NCFA_COOKIE}
    networks:
      - backend_net
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2-alpine
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - frontend_net
    depends_on:
      api:
        condition: service_started

  celery_worker:
    <<: *app
    logging: *default-logging
    restart: unless-stopped
    command: ["celery", "-A", "geostats.worker.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    environment:
      <<: *app-env
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    networks:
      - backend_net
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Metrics: disabled (grafana:latest ~380MB)
  # prometheus:
  #   image: prom/prometheus:latest
  # grafana:
  #   image: grafana/grafana:latest

networks:
  frontend_net:
  backend_net:

volumes:
  db_data:
  caddy_data:
  caddy_config:
  redis_data:
