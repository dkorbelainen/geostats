x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "psql -U ${POSTGRES_USER} -d ${POSTGRES_DB} -c 'SELECT 1' > /dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  migrate:
    build: .
    logging: *default-logging
    command: alembic upgrade head
    environment:
      DATABASE_URL: >-
        postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db/${POSTGRES_DB}
    networks:
      - backend_net
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  api:
    build: .
    logging: *default-logging
    restart: unless-stopped
    environment:
      DATABASE_URL: >-
        postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db/${POSTGRES_DB}
      GEOGUESSR_NCFA_COOKIE: ${GEOGUESSR_NCFA_COOKIE:-}
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - frontend_net
      - backend_net
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Health check
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  poller:
    build: .
    logging: *default-logging
    restart: unless-stopped
    command: >
      sh -c "
        TICK=0;
        while true; do
          geostats poll-top --limit 500;
          if [ $((TICK % 28)) -eq 0 ]; then
            geostats poll-discover --limit 1000;
            geostats compute-matches;
            geostats compute-anomalies;
          fi;
          geostats poll-new --limit 100;
          TICK=$((TICK + 1));
          sleep $((21600 + RANDOM % 2400 - 1200));
        done"
    environment:
      DATABASE_URL: >-
        postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db/${POSTGRES_DB}
      GEOGUESSR_NCFA_COOKIE: ${GEOGUESSR_NCFA_COOKIE}
    networks:
      - backend_net
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2-alpine
    logging: *default-logging
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - frontend_net
    depends_on:
      api:
        condition: service_healthy

networks:
  frontend_net:
  backend_net:

volumes:
  db_data:
  caddy_data:
  caddy_config:
